name: IdeaScout
options:
  bundleIdPrefix: com.mahoney
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 6QTPKSJB67
targets:
  IdeaScout:
    type: application
    platform: iOS
    sources:
      - path: IdeaScout
        excludes:
          - IdeaScout.storekit   # test-only purchase setup, not shipped in the app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahoney.IdeaScout
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: IdeaScout/Info.plist
      properties:
        CFBundleDisplayName: IdeaScout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.mahoney.IdeaScout.refresh]
        # Only standard HTTPS is used, so no export-compliance paperwork is needed at upload.
        ITSAppUsesNonExemptEncryption: false
  IdeaScoutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - IdeaScoutTests
      # Lets the tests check the StoreKit test file's product IDs on the device.
      - path: IdeaScout/IdeaScout.storekit
        buildPhase: resources
    dependencies:
      - target: IdeaScout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahoney.IdeaScoutTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  IdeaScout:
    build:
      targets:
        IdeaScout: all
        IdeaScoutTests: [test]
    run:
      # Lets purchases be tested from Xcode without real money (local StoreKit test file).
      storeKitConfiguration: IdeaScout/IdeaScout.storekit
    test:
      targets:
        - IdeaScoutTests
