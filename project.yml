name: IdeaScout
options:
  bundleIdPrefix: com.mahoney
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: 6QTPKSJB67
targets:
  IdeaScout:
    type: application
    platform: iOS
    sources:
      - path: IdeaScout
        excludes:
          - IdeaScout.storekit   # test-only purchase setup, not shipped in the app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahoney.IdeaScout
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Universal: iPhone (1) and iPad (2).
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: IdeaScout/Info.plist
      properties:
        CFBundleDisplayName: IdeaScout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # iPhone stays portrait (owner's choice, 31 Oct 2026). iPad allows every orientation, which Split View,
        # Slide Over and Stage Manager require.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
                                                UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.mahoney.IdeaScout.refresh]
        # Only standard HTTPS is used, so no export-compliance paperwork is needed at upload.
        ITSAppUsesNonExemptEncryption: false
  IdeaScoutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - IdeaScoutTests
      # Lets the tests check the StoreKit test file's product IDs on the device.
      - path: IdeaScout/IdeaScout.storekit
        buildPhase: resources
    dependencies:
      - target: IdeaScout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahoney.IdeaScoutTests
        GENERATE_INFOPLIST_FILE: YES
  IdeaScoutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - IdeaScoutUITests
    dependencies:
      - target: IdeaScout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahoney.IdeaScoutUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: IdeaScout
schemes:
  IdeaScout:
    build:
      targets:
        IdeaScout: all
        IdeaScoutTests: [test]
        IdeaScoutUITests: [test]
    run:
      # Lets purchases be tested from Xcode without real money (local StoreKit test file).
      storeKitConfiguration: IdeaScout/IdeaScout.storekit
    test:
      # Records how much of the app's code the tests run (Public store target: 80% of non-screen logic).
      gatherCoverageData: true
      coverageTargets:
        - IdeaScout
      targets:
        - IdeaScoutTests
        - IdeaScoutUITests
